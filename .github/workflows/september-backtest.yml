name: September 2026 Backtest V3.4

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/september-backtest.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Download official history
        run: |
          mkdir -p /tmp/jarvis

          curl -L --retry 5 --retry-delay 3 --fail \
            "https://github.com/Dani-Ionescu/nerdytips-data/raw/refs/heads/main/allMatches.xlsx" \
            -o /tmp/jarvis/allMatches.xlsx

          ls -lh /tmp/jarvis/allMatches.xlsx

      - name: Parse September 2026
        run: |
          python <<'PY'
          import json
          import re
          from pathlib import Path
          import pandas as pd

          FILE = "/tmp/jarvis/allMatches.xlsx"
          OUT = Path("data/backtest/2026-09.json")

          def clean(v):
              if pd.isna(v):
                  return ""
              return str(v).strip()

          def norm(v):
              return re.sub(
                  r"[^a-z0-9\u4e00-\u9fff]+",
                  "",
                  clean(v).lower()
              )

          def find_col(columns, candidates):
              best = None
              score_best = 0

              for col in columns:
                  n = norm(col)
                  score = 0

                  for c in candidates:
                      cc = norm(c)

                      if n == cc:
                          score += 100

                      elif cc in n:
                          score += len(cc)

                  if score > score_best:
                      score_best = score
                      best = col

              return best

          def parse_date_series(series):

              # 第一种：正常日期
              result = pd.to_datetime(
                  series,
                  errors="coerce"
              )

              # 第二种：从字符串中提取 YYYY-MM-DD
              missing = result.isna()

              if missing.any():

                  extracted = (
                      series.astype(str)
                      .str.extract(
                          r"(\d{4}-\d{1,2}-\d{1,2})",
                          expand=False
                      )
                  )

                  result.loc[missing] = pd.to_datetime(
                      extracted.loc[missing],
                      errors="coerce"
                  )

              return result

          def result_from_score(value):

              s = clean(value)

              # 支持：
              # 2-1
              # 2 : 1
              # 2–1
              # 2 1
              m = re.search(
                  r"(\d+)\s*[-:–]\s*(\d+)",
                  s
              )

              if not m:
                  return ""

              h = int(m.group(1))
              a = int(m.group(2))

              if h > a:
                  return "1"

              if h == a:
                  return "X"

              return "2"

          def normalize_result(value):

              s = clean(value).lower()

              if s in ["1", "home", "homewin", "主胜"]:
                  return "1"

              if s in ["x", "draw", "tie", "平", "平局"]:
                  return "X"

              if s in ["2", "away", "awaywin", "客胜"]:
                  return "2"

              score_result = result_from_score(value)

              return score_result

          def normalize_prediction(value):

              s = clean(value).lower()

              if not s:
                  return ""

              # 只接受明确的1X2
              if s in ["1", "home", "homewin", "主胜"]:
                  return "1"

              if s in ["x", "draw", "tie", "平", "平局"]:
                  return "X"

              if s in ["2", "away", "awaywin", "客胜"]:
                  return "2"

              # 某些数据可能是 "1X"
              if s == "1x":
                  return "1X"

              if s == "x2":
                  return "X2"

              return ""

          print("读取官方 Excel")

          book = pd.ExcelFile(FILE)

          print("工作表:", book.sheet_names)

          frames = []

          for sheet in book.sheet_names:

              df = pd.read_excel(
                  FILE,
                  sheet_name=sheet
              )

              if len(df) == 0:
                  continue

              print(
                  "Sheet:",
                  sheet,
                  "rows:",
                  len(df)
              )

              frames.append(df)

          if not frames:
              raise RuntimeError(
                  "Excel没有有效数据"
              )

          df = pd.concat(
              frames,
              ignore_index=True
          )

          df.columns = [
              clean(c)
              for c in df.columns
          ]

          print("字段:")
          print(list(df.columns))

          date_col = find_col(
              df.columns,
              [
                  "date",
                  "matchdate",
                  "fixturedate",
                  "kickoff",
                  "datetime",
                  "日期",
                  "比赛日期"
              ]
          )

          home_col = find_col(
              df.columns,
              [
                  "home",
                  "hometeam",
                  "home team",
                  "主队"
              ]
          )

          away_col = find_col(
              df.columns,
              [
                  "away",
                  "awayteam",
                  "away team",
                  "客队"
              ]
          )

          league_col = find_col(
              df.columns,
              [
                  "league",
                  "competition",
                  "tournament",
                  "联赛",
                  "赛事"
              ]
          )

          prediction_col = find_col(
              df.columns,
              [
                  "prediction",
                  "predicted",
                  "tip",
                  "pick",
                  "forecast",
                  "mainprediction",
                  "预测"
              ]
          )

          score_col = find_col(
              df.columns,
              [
                  "score",
                  "finalscore",
                  "final result",
                  "比分",
                  "最终比分"
              ]
          )

          result_col = find_col(
              df.columns,
              [
                  "result",
                  "outcome",
                  "actual",
                  "finalresult",
                  "赛果",
                  "结果"
              ]
          )

          confidence_col = find_col(
              df.columns,
              [
                  "confidence",
                  "confidence score",
                  "trust",
                  "rating",
                  "信心"
              ]
          )

          print("date =", date_col)
          print("home =", home_col)
          print("away =", away_col)
          print("league =", league_col)
          print("prediction =", prediction_col)
          print("score =", score_col)
          print("result =", result_col)
          print("confidence =", confidence_col)

          if not date_col:
              raise RuntimeError(
                  "找不到日期字段"
              )

          dates = parse_date_series(
              df[date_col]
          )

          # 关键修复：
          # 不再依赖错误的日期解析方式
          mask = (
              (dates >= pd.Timestamp("2026-09-01"))
              &
              (dates < pd.Timestamp("2026-10-01"))
          )

          df = df.loc[mask].copy()
          df["__date"] = dates.loc[mask]

          print(
              "2026年9月原始记录:",
              len(df)
          )

          rows = []

          for _, r in df.iterrows():

              prediction = ""

              if prediction_col:
                  prediction = normalize_prediction(
                      r[prediction_col]
                  )

              actual = ""

              if score_col:
                  actual = normalize_result(
                      r[score_col]
                  )

              if not actual and result_col:
                  actual = normalize_result(
                      r[result_col]
                  )

              # 没有明确预测和赛果的记录，
              # 不进入命中率计算
              if not prediction or not actual:
                  continue

              confidence = None

              if confidence_col:

                  try:
                      raw = clean(
                          r[confidence_col]
                      )

                      raw = (
                          raw.replace("%", "")
                          .replace("/10", "")
                      )

                      confidence = float(raw)

                  except Exception:
                      confidence = None

              home = (
                  clean(r[home_col])
                  if home_col
                  else ""
              )

              away = (
                  clean(r[away_col])
                  if away_col
                  else ""
              )

              league = (
                  clean(r[league_col])
                  if league_col
                  else ""
              )

              score = (
                  clean(r[score_col])
                  if score_col
                  else ""
              )

              hit = (
                  prediction == actual
              )

              rows.append({

                  "date":
                      r["__date"].strftime(
                          "%Y-%m-%d"
                      ),

                  "league": league,

                  "home": home,

                  "away": away,

                  "prediction":
                      prediction,

                  "result":
                      actual,

                  "score": score,

                  "confidence":
                      confidence,

                  "hit": hit

              })

          print(
              "有效逐场记录:",
              len(rows)
          )

          # ==============================
          # 去重
          # ==============================

          unique = {}

          for r in rows:

              key = (
                  r["date"],
                  r["league"],
                  r["home"],
                  r["away"],
                  r["prediction"],
                  r["score"]
              )

              unique[key] = r

          rows = list(
              unique.values()
          )

          print(
              "去重后:",
              len(rows)
          )

          total = len(rows)

          hit = sum(
              1
              for r in rows
              if r["hit"]
          )

          draw_rows = [
              r for r in rows
              if r["prediction"] == "X"
          ]

          draw_hit = sum(
              1
              for r in draw_rows
              if r["hit"]
          )

          def rate(a, b):

              if b == 0:
                  return None

              return round(
                  a / b * 100,
                  2
              )

          # ==============================
          # 冷门暂时不伪造
          # ==============================

          # 没有真实欧赔/竞彩赔率，
          # 不把 confidence 伪装成冷门指数
          upset_rows = []

          payload = {

              "version": "3.4",

              "source":
                  "NerdyTips official public archive",

              "period":
                  "2026-09",

              "source_month_total":
                  9071,

              "parsed_records":
                  len(df),

              "valid_records":
                  total,

              "hit":
                  hit,

              "hitRate":
                  rate(hit, total),

              "drawTotal":
                  len(draw_rows),

              "drawHit":
                  draw_hit,

              "drawHitRate":
                  rate(
                      draw_hit,
                      len(draw_rows)
                  ),

              "upsetTotal": 0,

              "upsetHit": 0,

              "upsetHitRate": None,

              "upsetStatus":
                  "需要真实赔率数据",

              "matches":
                  rows

          }

          OUT.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          OUT.write_text(
              json.dumps(
                  payload,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("============================")
          print("2026年9月回测")
          print("============================")
          print(
              "官方月度预测:",
              9071
          )
          print(
              "读取记录:",
              len(df)
          )
          print(
              "有效逐场:",
              total
          )
          print(
              "命中:",
              hit
          )
          print(
              "命中率:",
              payload["hitRate"]
          )
          print(
              "平局:",
              payload["drawHitRate"]
          )
          print("============================")
          PY

      - name: Save result
        run: |
          git config user.name "jarvis-backtest"
          git config user.email "actions@github.com"

          git add data/backtest/2026-09.json

          git diff --cached --quiet || \
          git commit -m "Fix September 2026 detailed backtest"

          git push
name: Jarvis Football AI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  football-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Get API-Football data
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json
          from datetime import datetime

          key = os.environ["API_FOOTBALL_KEY"]

          url = "https://v3.football.api-sports.io/fixtures"

          headers = {
              "x-apisports-key": key
          }

          params = {
              "date": datetime.utcnow().strftime("%Y-%m-%d")
          }

          r = requests.get(
              url,
              headers=headers,
              params=params,
              timeout=30
          )

          r.raise_for_status()

          data = r.json()

          print("API-Football connection OK")
          print("Fixtures:", len(data.get("response", [])))

          os.makedirs("data/api_football", exist_ok=True)

          with open(
              "data/api_football/today.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Commit football data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/api_football/today.json

          git diff --cached --quiet || \
          git commit -m "Update football API data"

          git push
name: Jarvis Football AI

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  jarvis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run existing tests
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_orchestrator -v

      - name: Jarvis AI status
        run: |
          echo "================================"
          echo "      JARVIS FOOTBALL AI"
          echo "================================"
          echo "ELO: ENABLED"
          echo "Poisson: ENABLED"
          echo "API-Football: READY"
          echo "Historical CSV: READY"
          echo "Market movement: NEXT"
          echo "Backtest: NEXT"
          echo "================================"
          echo "Jarvis workflow completed."
<!-- 2026年9月详细回测 V3.4 -->

<div class="card backtest">

<h2>🧪 2026年9月历史回测</h2>

<div class="muted">
2026-09-01 ～ 2026-09-30
</div>

<div class="grid" style="margin-top:10px">

<div class="metric">
官方样本
<b id="btSource">—</b>
</div>

<div class="metric">
有效样本
<b id="btGames">—</b>
</div>

<div class="metric">
总体命中
<b id="btHit">—</b>
</div>

<div class="metric">
平局命中
<b id="btDraw">—</b>
</div>

</div>

<button
class="primary"
onclick="runBacktest()">

🧪 读取9月详细回测

</button>

<div
id="backtestResult"
class="signal">

等待读取……

</div>

<div
id="backtestMatches"
style="margin-top:12px">

</div>

</div>

<script>

async function runBacktest(){

const result =
document.getElementById(
"backtestResult"
);

const list =
document.getElementById(
"backtestMatches"
);

result.innerHTML =
"🔄 正在读取9月逐场数据……";

list.innerHTML = "";

try{

const response =
await fetch(
"data/backtest/2026-09.json?"+
Date.now()
);

if(!response.ok){

throw new Error(
"HTTP "+
response.status
);

}

const data =
await response.json();

const rows =
data.matches || [];

document.getElementById(
"btSource"
).textContent =
data.source_month_total ||
"—";

document.getElementById(
"btGames"
).textContent =
data.valid_records ||
rows.length;

document.getElementById(
"btHit"
).textContent =
data.hitRate === null ||
data.hitRate === undefined
?
"—"
:
data.hitRate+"%";

document.getElementById(
"btDraw"
).textContent =
data.drawHitRate === null ||
data.drawHitRate === undefined
?
"—"
:
data.drawHitRate+"%";


result.innerHTML =

"🟢 <b>9月详细回测已加载</b>"+
"<br><br>"+
"官方月度样本："+
(data.source_month_total || "—")+
"<br>"+
"系统有效样本："+
(data.valid_records || rows.length)+
"<br>"+
"总体命中率："+
(
data.hitRate == null
?
"—"
:
data.hitRate+"%"
)+
"<br>"+
"平局命中率："+
(
data.drawHitRate == null
?
"—"
:
data.drawHitRate+"%"
)+
"<br><br>"+
"<span class='muted'>"+
"冷门指数暂不计算：当前没有真实赔率数据。"+
"</span>";


if(!rows.length){

list.innerHTML =
"<div class='signal'>"+
"没有逐场记录。"+
"</div>";

return;

}


const fragment =
document.createDocumentFragment();


rows.forEach(
(row,index)=>{

const div =
document.createElement(
"div"
);

div.className =
"match";

const hit =
row.hit === true;

const hitText =
hit
?
"✓ 命中"
:
"✕ 未命中";

const hitClass =
hit
?
"good"
:
"bad";

const prediction =
row.prediction || "—";

const result =
row.result || "—";

div.innerHTML = `

<div class="league">

${escapeHtml(
row.date || ""
)}

 ·

${escapeHtml(
row.league || "未知赛事"
)}

</div>

<div class="row">

<div class="team">

${escapeHtml(
row.home || "主队"
)}

<br>

<span class="muted">

vs

${escapeHtml(
row.away || "客队"
)}

</span>

</div>

<span class="badge ${hitClass}">

${hitText}

</span>

</div>

<div
class="signal"
style="margin-top:8px">

<div class="line">

<span>预测</span>

<b>${prediction}</b>

</div>

<div class="line">

<span>实际赛果</span>

<b>${result}</b>

</div>

<div class="line">

<span>最终比分</span>

<b>${escapeHtml(
row.score || "—"
)}</b>

</div>

<div class="line">

<span>信心</span>

<b>${
row.confidence == null
?
"—"
:
escapeHtml(
String(row.confidence)
)
}</b>

</div>

</div>

`;

fragment.appendChild(
div
);

});

list.appendChild(
fragment
);

}catch(error){

console.error(error);

result.innerHTML =

"🔴 <b>读取失败</b>"+
"<br><br>"+
escapeHtml(
error.message
)+
"<br><br>"+
"请确认 GitHub Actions 已经绿色完成。";

}

}


function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;")

.replaceAll("'","&#039;");

}

</script>

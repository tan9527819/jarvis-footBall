<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>竞彩足球预测分析 V3.8 AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#edf4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:980px;margin:auto;padding:12px}.hero{background:#142753;padding:20px 15px;border-radius:0 0 20px 20px;margin:-12px -12px 14px}.hero h1{margin:0;font-size:23px}.hero p{margin:7px 0 0;color:#a9bad4;font-size:12px}
.card{background:#0d1a2b;border:1px solid #284466;border-radius:15px;padding:14px;margin-bottom:12px}h2{font-size:17px;margin:0 0 8px}.muted,.small{color:#8196b2;font-size:12px}.btn{border:0;border-radius:10px;padding:11px 13px;background:#587cf5;color:#fff;font-weight:700}.wide{width:100%;margin-top:9px}
.status{padding:11px;background:#101f33;border-radius:10px;line-height:1.7;margin-top:9px}.ok{color:#70e49a}.warn{color:#ffd27b}.bad{color:#ff8181}
.match{background:#0f2034;border:1px solid #294461;border-radius:13px;margin-top:9px;overflow:hidden}.mh{padding:12px}.league{font-size:11px;color:#8ca5c3}.teams{font-weight:800;font-size:17px;margin:7px 0}.tag{display:inline-block;background:#1a304b;border-radius:7px;padding:4px 7px;font-size:10px;margin:2px 4px 2px 0}
.exp{width:100%;border:0;background:#17304b;color:#fff;padding:11px;font-weight:700}.detail{display:none;padding:12px;background:#091522;border-top:1px solid #28415e}.detail.open{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{background:#0e2035;border-radius:9px;padding:9px}.box span{display:block;color:#8298b4;font-size:10px}.box b{display:block;margin-top:3px;font-size:13px}
.bar{height:8px;background:#17283d;border-radius:8px;overflow:hidden;margin:5px 0 10px}.fill{height:100%;background:#6c8cff;border-radius:8px}.score{font-size:21px;font-weight:900}.ai{font-size:18px;font-weight:900}.line{border-top:1px solid #233a55;margin:12px 0}
.pages{display:flex;gap:8px;margin-top:10px}.pages .btn{flex:1;background:#203654}.btn:disabled{opacity:.35}
.empty{text-align:center;padding:25px 8px;color:#8195af}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>⚽ 竞彩足球预测分析 V3.8 AI</h1><p>中国竞彩赛事过滤 · 胜平负 · AI多证据判断 · 冷门风险</p></div>

<div class="card">
<h2>🎯 赛事入口</h2>
<div class="muted">只分析能匹配中国竞彩足球的赛事；无法匹配的比赛自动隐藏。</div>
<button class="btn wide" onclick="loadToday()">🔄 读取今日竞彩赛事</button>
<div id="todayStatus" class="status">等待读取……</div>
</div>

<div class="card">
<h2>📋 中国竞彩比赛</h2>
<div id="list"><div class="empty">点击上面的按钮开始</div></div>
<div class="pages"><button id="prev" class="btn" onclick="page(-1)" disabled>← 上一页</button><button id="next" class="btn" onclick="page(1)" disabled>下一页 →</button></div>
</div>

<div class="card">
<h2>🧠 AI判断规则</h2>
<div class="small">
AI不是凭空猜赛果。每场先通过竞彩赛事过滤，再对已有数据进行多证据评分：近期状态、主客场、进失球、赔率变化、历史同赔、相似盘、数据异动和冷门风险。<br><br>
当关键数据缺失或互相冲突时，AI会降低置信度，并显示“证据不足 / 暂不推荐”，不会为了凑推荐强行给结果。
</div>
</div>
</div>

<script>
let games=[],pg=0;const SIZE=10;
let TOP5={"Premier League":"英超","La Liga":"西甲","Serie A":"意甲","Bundesliga":"德甲","Ligue 1":"法甲"};
let CN={
"Arsenal":"阿森纳","Aston Villa":"阿斯顿维拉","Bournemouth":"伯恩茅斯","Brentford":"布伦特福德","Brighton":"布莱顿","Chelsea":"切尔西","Crystal Palace":"水晶宫","Everton":"埃弗顿","Fulham":"富勒姆","Liverpool":"利物浦","Manchester City":"曼城","Manchester United":"曼联","Newcastle":"纽卡斯尔联","Nottingham Forest":"诺丁汉森林","Tottenham":"托特纳姆热刺","West Ham":"西汉姆联","Wolverhampton":"狼队","Real Madrid":"皇家马德里","Barcelona":"巴塞罗那","Atletico Madrid":"马德里竞技","Athletic Club":"毕尔巴鄂竞技","Real Sociedad":"皇家社会","Villarreal":"比利亚雷亚尔","Real Betis":"皇家贝蒂斯","Sevilla":"塞维利亚","Valencia":"瓦伦西亚","Girona":"赫罗纳","Inter":"国际米兰","Inter Milan":"国际米兰","Milan":"AC米兰","AC Milan":"AC米兰","Juventus":"尤文图斯","Napoli":"那不勒斯","Roma":"罗马","Lazio":"拉齐奥","Atalanta":"亚特兰大","Fiorentina":"佛罗伦萨","Bologna":"博洛尼亚","Bayern Munich":"拜仁慕尼黑","Bayern München":"拜仁慕尼黑","Borussia Dortmund":"多特蒙德","Bayer Leverkusen":"勒沃库森","RB Leipzig":"RB莱比锡","Eintracht Frankfurt":"法兰克福","PSG":"巴黎圣日耳曼","Paris Saint Germain":"巴黎圣日耳曼","Paris Saint-Germain":"巴黎圣日耳曼","Marseille":"马赛","Lyon":"里昂","Monaco":"摩纳哥","Lille":"里尔","Nice":"尼斯","Lens":"朗斯","Rennes":"雷恩","Nantes":"南特","Toulouse":"图卢兹"
};
function esc(x){return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function league(x){return TOP5[x]||x||"未知联赛"}
function team(x){return CN[String(x||"").trim()]||String(x||"—")}
function val(o,...keys){for(const k of keys){if(o?.[k]!=null&&o[k]!=="")return o[k]}return null}
function result(x){let m={"1":"胜","X":"平","2":"负","HOME":"胜","DRAW":"平","AWAY":"负","胜":"胜","平":"平","负":"负"};return m[String(x||"").toUpperCase()]||"—"}
function num(x){let n=parseFloat(x);return Number.isFinite(n)?n:null}

/* 中国竞彩赛事过滤：
   优先读取后端提供的 chinese_jc / jc / sporttery 字段；
   若没有，则只接受明确的中国竞彩联赛白名单。
   这样不会把全球API赛事全部当成竞彩比赛。 */
const JC_LEAGUES=[
"Premier League","La Liga","Serie A","Bundesliga","Ligue 1",
"UEFA Champions League","UEFA Europa League","Europa League",
"World Cup","FIFA World Cup","European Championship","FA Cup",
"DFB Pokal","Coppa Italia","Copa del Rey","Eredivisie",
"Primeira Liga","Scottish Premiership","J1 League","K League 1",
"Saudi Pro League","A-League"
];
function isJC(g){
 if(g?.chinese_jc===true||g?.jc===true||g?.sporttery===true)return true;
 let n=String(g?.league?.name||g?.league_name||g?.competition||"").trim();
 return JC_LEAGUES.some(x=>x.toLowerCase()===n.toLowerCase());
}
function normalize(g){
 let lr=String(g?.league?.name||g?.league_name||g?.competition||"");
 let h=val(g?.teams?.home,"name")??val(g?.home,"name")??g?.home??g?.home_team;
 let a=val(g?.teams?.away,"name")??val(g?.away,"name")??g?.away??g?.away_team;
 return {raw:g,league:lr,home:String(h||"主队"),away:String(a||"客队"),date:g?.date||g?.fixture?.date||"",odds:g?.odds||g?.bookmakers||null};
}
function pct(x){return Math.round(Math.max(0,Math.min(100,x)))}
function ai(g){
 /* 支持后端已经计算好的字段；没有字段时不伪造数据 */
 let r=g.raw||{}, features=r.ai_features||r.features||{};
 let hasData=Object.keys(features).length>0 || r.ai_score!=null || r.probabilities!=null || r.prediction!=null;
 if(!hasData)return {enough:false,p:"暂不推荐",pcts:null,confidence:0,reason:"当前赛事缺少可验证的模型输入数据"};
 let p=r.probabilities||features.probabilities||{};
 let win=num(p.win??p.home??r.home_probability),draw=num(p.draw??r.draw_probability),loss=num(p.loss??p.away??r.away_probability);
 if(win==null||draw==null||loss==null)return {enough:false,p:"暂不推荐",pcts:null,confidence:0,reason:"胜平负概率数据不完整"};
 let arr=[["胜",win],["平",draw],["负",loss]].sort((a,b)=>b[1]-a[1]);
 let conf=pct((arr[0][1]-arr[1][1])*1.5+50);
 let conflicts=Number(r.data_conflict??features.data_conflict??0);
 if(conflicts>=2){conf=Math.max(20,conf-15)}
 return {enough:true,p:arr[0][0],pcts:{win,draw,loss},confidence:conf,reason:conflicts>=2?"多源数据存在冲突":"主要数据方向一致"};
}
function report(g){
 let a=ai(g),r=g.raw||{},f=r.ai_features||r.features||{};
 let odds=r.odds||r.jc_odds||{};
 let recent=f.recent_form??r.recent_form??"未提供";
 let home=f.home_away??r.home_away??"未提供";
 let hist=f.historical_match??r.historical_match??"未提供";
 let movement=f.odds_movement??r.odds_movement??"未提供";
 let upset=f.upset_risk??r.upset_risk??"未评估";
 let reasons=f.reasons??r.ai_reasons??[];
 if(!Array.isArray(reasons))reasons=[String(reasons)];
 return `<div class="detail">
 <div class="grid">
 <div class="box"><span>近期状态</span><b>${esc(recent)}</b></div>
 <div class="box"><span>主客场</span><b>${esc(home)}</b></div>
 <div class="box"><span>历史同赔/相似盘</span><b>${esc(hist)}</b></div>
 <div class="box"><span>赔率/变盘</span><b>${esc(movement)}</b></div>
 </div>
 <div class="line"></div>
 <b>🧠 AI综合判断</b>
 ${a.enough?`<p class="ai">首选：${esc(a.p)}</p>
 <div>胜 ${a.pcts.win}%</div><div class="bar"><div class="fill" style="width:${pct(a.pcts.win)}%"></div></div>
 <div>平 ${a.pcts.draw}%</div><div class="bar"><div class="fill" style="width:${pct(a.pcts.draw)}%"></div></div>
 <div>负 ${a.pcts.loss}%</div><div class="bar"><div class="fill" style="width:${pct(a.pcts.loss)}%"></div></div>
 <div class="box"><span>AI置信度</span><b>${a.confidence}/100</b></div>`
 :`<p class="warn">⚠ ${esc(a.reason)}</p><div class="box"><span>AI结论</span><b>证据不足 → 暂不推荐</b></div>`}
 <div class="line"></div>
 <b>🔥 冷门风险：${esc(upset)}</b>
 <p class="small">${reasons.length?reasons.map(x=>"• "+esc(x)).join("<br>"):"暂无可验证的AI理由"}</p>
 <div class="line"></div>
 <b>📌 最终结论</b>
 <p>${a.enough?`首选：<strong>${esc(a.p)}</strong>；AI置信度 ${a.confidence}/100。`:"暂不推荐：需要赔率、近期数据或历史匹配数据后再判断。"}</p>
 <p class="small">AI只使用网页实际收到的数据；缺数据不自动编造。</p>
 </div>`;
}
function render(){
 let b=document.getElementById("list"),start=pg*SIZE,rows=games.slice(start,start+SIZE);
 if(!rows.length){b.innerHTML='<div class="empty">没有匹配到中国竞彩赛事</div>';document.getElementById("prev").disabled=true;document.getElementById("next").disabled=true;return}
 b.innerHTML=rows.map((g,i)=>`<div class="match"><div class="mh">
 <div class="league">${esc(league(g.league))}</div>
 <div class="teams">${esc(team(g.home))} <span style="color:#7087a5">VS</span> ${esc(team(g.away))}</div>
 <span class="tag">中国竞彩候选</span><span class="tag">胜平负</span>
 </div><button class="exp" onclick="this.nextElementSibling.classList.toggle('open')">🧠 展开AI完整分析</button>${report(g)}</div>`).join("");
 document.getElementById("prev").disabled=pg===0;
 document.getElementById("next").disabled=start+SIZE>=games.length;
}
function page(d){pg=Math.max(0,pg+d);render()}
async function loadToday(){
 let s=document.getElementById("todayStatus"),b=document.getElementById("list");s.innerHTML="🔄 正在读取……";
 try{
  let r=await fetch("data/api_football/today.json?t="+Date.now());if(!r.ok)throw Error("HTTP "+r.status);
  let d=await r.json(),arr=Array.isArray(d)?d:(d.response||d.matches||d.fixtures||[]);
  let all=arr.length;games=arr.map(normalize).filter(x=>isJC(x.raw));
  pg=0;render();
  s.innerHTML=`<span class="ok">🟢 读取完成</span><br>API赛事：${all} 场<br>匹配竞彩：${games.length} 场<br>已自动删除无法匹配的赛事`;
 }catch(e){games=[];render();s.innerHTML='<span class="bad">🔴 读取失败</span><br>'+esc(e.message)+'<br><span class="small">请确认 data/api_football/today.json 已由 GitHub Actions 生成。</span>'}
}
loadToday();
</script>
</body>
</html>


name: Football-Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download historical data
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone

          leagues = ["E0", "E1", "SP1", "D1", "I1", "F1", "N1", "P1", "SC0"]
          now = datetime.now(timezone.utc)
          start = now.year if now.month >= 7 else now.year - 1
          seasons = [
              f"{y % 100:02d}{(y + 1) % 100:02d}"
              for y in range(start - 5, start + 1)
          ]

          matches = []
          files = []

          for season in seasons:
              for league in leagues:
                  url = f"https://www.football-data.co.uk/mmz4281/{season}/{league}.csv"
                  try:
                      req = urllib.request.Request(
                          url, headers={"User-Agent": "Mozilla/5.0"}
                      )
                      with urllib.request.urlopen(req, timeout=20) as response:
                          content = response.read().decode("utf-8-sig")
                      reader = csv.DictReader(io.StringIO(content))
                      count = 0

                      for r in reader:
                          home, away = r.get("HomeTeam"), r.get("AwayTeam")
                          date = r.get("Date")
                          if not home or not away or not date:
                              continue

                          def number(key):
                              try:
                                  return float(r[key])
                              except (ValueError, TypeError, KeyError):
                                  return None

                          hg, ag = number("FTHG"), number("FTAG")
                          matches.append({
                              "source": "Football-Data.co.uk",
                              "season": season,
                              "league": league,
                              "date": date,
                              "home": home,
                              "away": away,
                              "home_goals": hg,
                              "away_goals": ag,
                              "result": r.get("FTR"),
                              "odds": {
                                  "home": number("B365H"),
                                  "draw": number("B365D"),
                                  "away": number("B365A")
                              }
                          })
                          count += 1

                      if count:
                          files.append(url)
                          print(f"{season} {league}: {count} matches")
                  except Exception as e:
                      print(f"Skipped {season} {league}: {e}")

          if not matches:
              raise SystemExit("No data downloaded; check source availability.")

          output = {
              "source": "Football-Data.co.uk",
              "is_live_feed": False,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "match_count": len(matches),
              "downloaded_files": files,
              "matches": matches
          }

          path = Path("data/football_data/matches.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(
              json.dumps(output, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          print(f"SUCCESS: {len(matches)} historical matches")

          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/football_data/matches.json
          git diff --cached --quiet || (
            git commit -m "Update historical football data"
            git push
          )

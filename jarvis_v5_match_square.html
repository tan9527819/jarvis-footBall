<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS Football AI·赛事广场</title><style>*{box-sizing:border-box}body{margin:0;background:#07101d;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:980px;margin:auto;padding:12px}.top{position:sticky;top:0;background:#07101df5;padding:12px 2px;border-bottom:1px solid #203148;z-index:2}.brand{font-size:22px;font-weight:800}.sub{font-size:11px;color:#8297b1;margin-top:4px}.nav,.filter{display:flex;gap:7px;overflow:auto;margin:12px 0}.nav button,.filter button,.act{border:1px solid #263c55;background:#0d1a2b;color:#b9c9db;border-radius:9px;padding:8px 12px;white-space:nowrap}.on{background:#20446b!important;color:white!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat,.card{background:#0d1a2b;border:1px solid #1d3149;border-radius:15px}.stat{padding:10px}.stat b{font-size:18px}.stat span{display:block;font-size:9px;color:#8196b2}.card{padding:13px;margin:9px 0}.league{font-size:10px;color:#7e9ab8}.time{float:right;font-size:11px;color:#9eb2c8}.teams{font-size:16px;font-weight:800;margin:10px 0}.vs{color:#627995;padding:0 7px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:9px;padding:5px 7px;border-radius:7px;background:#18283b;color:#adc1d5}.ok{background:#143629;color:#91dfbc}.warn{background:#45331b;color:#ffd58e}.five{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.five div{background:#091421;border-radius:8px;padding:7px 3px;text-align:center;font-size:9px;color:#7f96af}.five b{display:block;color:#edf4ff;font-size:11px;margin-top:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.actions button{width:100%;border:0;border-radius:8px;background:#183653;color:#dcecff;padding:8px}.detail{display:none;border-top:1px solid #1d3047;margin-top:10px;padding-top:10px}.detail.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.box{background:#091421;border-radius:8px;padding:8px}.k{font-size:9px;color:#7188a3}.v{font-size:12px;margin-top:3px}.gate{margin-top:8px;padding:9px;border-radius:9px;background:#2a2118;color:#e6c69c;font-size:10px}.empty{text-align:center;color:#8196b0;padding:45px 10px}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><div class="w"><div class="top"><div class="brand">⚽ JARVIS Football AI</div><div class="sub">赛事广场 · 五维预测 · 证据优先</div></div><div class="nav"><button class="on">赛事广场</button><button>AI推荐</button><button>数据异动</button><button>历史数据库</button></div><div class="stats"><div class="stat"><b id="n">—</b><span>今日赛事</span></div><div class="stat"><b id="h">—</b><span>重点赛事</span></div><div class="stat"><b id="r">—</b><span>风险赛事</span></div><div class="stat"><b id="s">检测</b><span>数据状态</span></div></div><div class="filter"><button class="on" data-f="all">全部</button><button data-f="hot">🔥重点</button><button data-f="risk">⚠️风险</button><button data-f="early">早场</button></div><div id="list"><div class="empty">正在读取赛事数据…</div></div></div><script>let G=[],SRC="";const P=["data/api_football/today.json","demo/data/api_football/today.json","demo/data/samples/sample.json","data/samples/sample.json","samples/sample.json"],N=d=>Array.isArray(d)?d:(d?.response||d?.matches||d?.fixtures||[]),T=g=>g?.fixture?.date||g?.date||g?.kickoff||g?.start_time,L=(g,s)=>g?.teams?.[s]?.name||g?.[s]?.name||g?.[s]||"未知球队",R=g=>/risk|warning|anomaly|异动|风险|冷门/i.test(JSON.stringify(g)),H=(g,i)=>R(g)||i<Math.max(3,Math.ceil(G.length*.15)),TM=g=>{let d=new Date(T(g));return T(g)&&!isNaN(d)?d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}):"时间待定"};async function load(){for(const p of P)try{let q=await fetch(p+"?t="+Date.now());if(!q.ok)continue;let d=await q.json(),a=N(d);if(a.length||p.includes("sample")){G=a;SRC=p;break}}catch(e){}}function draw(f="all"){let a=G.map((g,i)=>({g,i})).filter(x=>f=="all"||(f=="risk"&&R(x.g))||(f=="hot"&&H(x.g,x.i))||(f=="early"&&T(x.g)&&new Date(T(x.g)).getHours()<12));list.innerHTML=a.length?a.map(({g,i})=>{let id="d"+i,r=R(g),h=H(g,i);return `<div class="card"><span class="league">${g?.league?.name||g?.league_name||"未知联赛"}</span><span class="time">${TM(g)}</span><div class="teams">${L(g,"home")}<span class="vs">VS</span>${L(g,"away")}</div><div class="tags"><span class="tag ${h?"warn":"ok"}">${h?"🔥重点赛事":"普通赛事"}</span><span class="tag ${r?"warn":"ok"}">${r?"⚠️风险":"基础数据正常"}</span><span class="tag">${SRC.includes("sample")?"测试数据":"实时数据"}</span></div><div class="five"><div>胜平负<b>待分析</b></div><div>让球<b>待分析</b></div><div>进球数<b>待分析</b></div><div>比分<b>待分析</b></div><div>半全场<b>待分析</b></div></div><div class="actions"><button onclick="document.getElementById('${id}').classList.toggle('open')">🧠 五维分析</button><button onclick="document.getElementById('${id}').classList.toggle('open')">📊 数据证据</button></div><div class="detail" id="${id}"><div class="grid"><div class="box"><div class="k">胜/平/负</div><div class="v">待接入赔率</div></div><div class="box"><div class="k">让球</div><div class="v">待接入盘口</div></div><div class="box"><div class="k">进球数</div><div class="v">待接入Poisson</div></div><div class="box"><div class="k">比分</div><div class="v">待接入模型</div></div><div class="box"><div class="k">历史同赔</div><div class="v">待接入CSV</div></div><div class="box"><div class="k">盘口异动</div><div class="v">待接入</div></div></div><div class="gate">Risk Gate：证据不完整时不生成虚假概率。当前结论：<b>暂不推荐</b>。</div></div></div>`}).join(""):'<div class="empty">暂无符合条件的赛事</div>'}document.querySelectorAll(".filter button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter button").forEach(x=>x.classList.remove("on"));b.classList.add("on");draw(b.dataset.f)});(async()=>{await load();n.textContent=G.length;h.textContent=G.filter((g,i)=>H(g,i)).length;r.textContent=G.filter(R).length;s.textContent=SRC.includes("sample")?"测试":"正常";draw()})();</script></body></html>

<!doctype html>
<html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>竞彩足球预测分析 V3.7</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07101d;color:#eef4ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.container{max-width:980px;margin:auto;padding:12px}.header{background:#142753;border-radius:0 0 20px 20px;padding:22px 16px;margin:-12px -12px 15px}
.header h1{margin:0;font-size:24px}.header p{margin:7px 0;color:#9db0d0;font-size:13px}
.card{background:#0d1a2b;border:1px solid #25436d;border-radius:16px;padding:15px;margin-bottom:13px}h2{font-size:18px;margin:0 0 7px}
.muted{color:#8da1bd;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}
.stat{background:#081322;border-radius:12px;padding:12px}.stat span{display:block;color:#8da1bd;font-size:12px}.stat b{font-size:22px}
button{border:0;border-radius:10px;padding:11px 14px;background:#587cf5;color:white;font-weight:700}.primary{width:100%}
.status{background:#101f33;border-radius:11px;padding:12px;margin-top:11px;line-height:1.7}.good{color:#71e69a}.bad{color:#ff7e7e}.warning{color:#ffd27b}
.match{background:#101f34;border:1px solid #243c5b;border-radius:13px;margin-top:9px;overflow:hidden}.match-head{padding:12px}
.league{color:#8fa7c4;font-size:11px}.teams{font-size:16px;font-weight:700;margin:7px 0}.badge{display:inline-block;padding:4px 7px;border-radius:7px;background:#1a304b;font-size:11px;margin-right:4px}
.hit{background:#123b2a;color:#76e4a0}.miss{background:#3b2025;color:#ff9494}.expand{width:100%;border-radius:0;background:#172f4b;font-size:13px}
.detail{display:none;padding:12px;background:#091522;border-top:1px solid #263c59}.detail.open{display:block}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.box{background:#0e2035;border-radius:9px;padding:9px}.box span{display:block;color:#8298b4;font-size:10px}.box b{display:block;margin-top:3px;font-size:13px}
.pagination{display:flex;gap:8px;margin-top:12px}.pagination button{flex:1;background:#203553}.pagination button:disabled{opacity:.35}
.empty{text-align:center;padding:30px 10px;color:#8196b0}.small{color:#7188a3;font-size:11px;line-height:1.7}
</style></head><body><div class="container">
<div class="header"><h1>⚽ 竞彩足球预测分析 V3.7</h1><p>五大联赛自动汉化 · 胜平负 · 让球 · 历史回测</p></div>
<div class="card"><h2>📅 今日赛事</h2><div class="muted">数据状态：<span id="todayStatus">读取中</span></div>
<button class="primary" style="margin-top:10px" onclick="loadToday()">🔄 刷新今日比赛</button><div id="todayList"><div class="empty">正在读取赛事……</div></div></div>
<div class="card"><h2>🧪 2026年9月历史回测</h2><div class="muted">2026-09-01 ～ 2026-09-30</div>
<div class="stats"><div class="stat"><span>官方月度记录</span><b id="sourceTotal">—</b></div><div class="stat"><span>有效样本</span><b id="validTotal">—</b></div><div class="stat"><span>总体命中率</span><b id="hitRate">—</b></div><div class="stat"><span>平局命中率</span><b id="drawRate">—</b></div></div>
<button class="primary" onclick="loadBacktest()">🧪 读取9月回测</button><div id="backtestStatus" class="status">等待读取……</div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>📋 9月逐场比赛</h2><span class="muted" id="pageInfo">第0页</span></div>
<div id="matchList"><div class="empty">点击“读取9月回测”</div></div><div class="pagination"><button id="prevBtn" onclick="prevPage()" disabled>← 上一页</button><button id="nextBtn" onclick="nextPage()" disabled>下一页 →</button></div></div>
<div class="card"><h2>🔥 冷门雷达</h2><div class="status"><span class="warning">当前：证据优先</span><p class="small">没有真实竞彩赔率、初盘、变盘数据时，不虚构冷门概率。</p><b class="warning">冷门：暂不推荐</b></div></div>
<div class="card"><h2>🛡️ 风险控制</h2><p class="small">数据不足或模型冲突时，不强行给出结果。</p><p class="small">本页面用于历史数据研究，不保证比赛结果。</p></div></div>
<script>
let TEAM_CN={},backtestData=[],currentPage=0;const PAGE_SIZE=20;
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const resultCN=v=>({"1":"胜","X":"平","2":"负","1X":"胜/平","X2":"平/负","12":"胜/负","HOME":"胜","DRAW":"平","AWAY":"负","胜":"胜","平":"平","负":"负"}[String(v??"").trim().toUpperCase()]||"—");
const leagueCN=v=>({"Premier League":"英超","English Premier League":"英超","La Liga":"西甲","Primera Division":"西甲","Serie A":"意甲","Bundesliga":"德甲","Ligue 1":"法甲"}[String(v??"").trim()]||String(v??"未知联赛"));
function teamCN(name,league){let n=String(name??"").trim();if(TEAM_CN[league]?.[n])return TEAM_CN[league][n];for(const k in TEAM_CN)if(TEAM_CN[k][n])return TEAM_CN[k][n];return n||"—";}
async function loadTeamCN(){try{let r=await fetch("data/team_cn.json?t="+Date.now());if(r.ok)TEAM_CN=await r.json()}catch(e){}}
async function loadToday(){let b=document.getElementById("todayList"),s=document.getElementById("todayStatus");b.innerHTML='<div class="empty">读取中……</div>';try{let r=await fetch("data/api_football/today.json?t="+Date.now());if(!r.ok)throw Error("HTTP "+r.status);let d=await r.json(),gs=Array.isArray(d)?d:(d.response||d.matches||d.fixtures||[]);if(!gs.length){s.textContent="暂无";b.innerHTML='<div class="empty">暂无今日比赛数据</div>';return}s.textContent="正常 · "+gs.length+"场";b.innerHTML=gs.slice(0,30).map(g=>{let lr=g?.league?.name||g?.league_name||"",h=g?.teams?.home?.name||g?.home?.name||g?.home||"主队",a=g?.teams?.away?.name||g?.away?.name||g?.away||"客队";return `<div class="match"><div class="match-head"><div class="league">${esc(leagueCN(lr))}</div><div class="teams">${esc(teamCN(h,lr))} <span style="color:#7188a3">VS</span> ${esc(teamCN(a,lr))}</div><span class="badge">待分析</span></div><button class="expand" onclick="this.nextElementSibling.classList.toggle('open')">🧠 展开详细分析</button><div class="detail"><div class="detail-grid"><div class="box"><span>胜平负</span><b>待接入赔率</b></div><div class="box"><span>让球胜平负</span><b>待接入盘口</b></div><div class="box"><span>比分</span><b>待接入模型</b></div><div class="box"><span>历史同赔</span><b>待接入CSV</b></div></div><p class="small">当前证据不足 → 暂不推荐</p></div></div>`}).join("")}catch(e){s.textContent="失败";b.innerHTML='<div class="empty">无法读取今日数据<br><br>'+esc(e.message)+'</div>}}
async function loadBacktest(){let s=document.getElementById("backtestStatus");s.innerHTML="🔄 正在读取9月数据……";try{let r=await fetch("data/backtest/2026-09.json?t="+Date.now());if(!r.ok)throw Error("HTTP "+r.status);let d=await r.json();backtestData=Array.isArray(d.matches)?d.matches:[];document.getElementById("sourceTotal").textContent=d.source_month_total??"—";document.getElementById("validTotal").textContent=d.valid_records??backtestData.length;document.getElementById("hitRate").textContent=d.hitRate==null?"—":d.hitRate+"%";document.getElementById("drawRate").textContent=d.drawHitRate==null?"—":d.drawHitRate+"%";s.innerHTML='<span class="good">🟢 9月数据读取成功</span><br>逐场记录：'+backtestData.length;currentPage=0;renderPage()}catch(e){s.innerHTML='<span class="bad">🔴 9月数据读取失败</span><br>'+esc(e.message)}}
function renderPage(){let b=document.getElementById("matchList"),t=backtestData.length;if(!t){b.innerHTML='<div class="empty">没有逐场数据</div>';updatePagination();return}let rows=backtestData.slice(currentPage*PAGE_SIZE,currentPage*PAGE_SIZE+PAGE_SIZE);b.innerHTML=rows.map(r=>{let lr=r.league||"",hit=r.hit===true,p=resultCN(r.prediction),a=resultCN(r.result);return `<div class="match"><div class="match-head"><div class="league">${esc(r.date||"")} · ${esc(leagueCN(lr))}</div><div class="teams">${esc(teamCN(r.home||"主队",lr))} <span style="color:#7188a3">VS</span> ${esc(teamCN(r.away||"客队",lr))}</div><b>预测：${esc(p)}</b><br><span class="badge ${hit?"hit":"miss"}">${hit?"✓ 命中":"✕ 未命中"}</span><span class="badge">实际：${esc(a)}</span><div style="margin-top:7px">比分：<b>${esc(r.score||"—")}</b></div></div><button class="expand" onclick="this.nextElementSibling.classList.toggle('open')">📊 展开本场详细分析</button><div class="detail"><div class="detail-grid"><div class="box"><span>联赛</span><b>${esc(leagueCN(lr))}</b></div><div class="box"><span>主队</span><b>${esc(teamCN(r.home||"—",lr))}</b></div><div class="box"><span>客队</span><b>${esc(teamCN(r.away||"—",lr))}</b></div><div class="box"><span>预测</span><b>${esc(p)}</b></div><div class="box"><span>实际结果</span><b>${esc(a)}</b></div><div class="box"><span>比分</span><b>${esc(r.score||"—")}</b></div></div></div></div>`}).join("");updatePagination()}
function updatePagination(){let t=backtestData.length,p=Math.max(1,Math.ceil(t/PAGE_SIZE));document.getElementById("pageInfo").textContent="第 "+(t?currentPage+1:0)+" / "+(t?p:0)+" 页";document.getElementById("prevBtn").disabled=currentPage<=0;document.getElementById("nextBtn").disabled=currentPage>=p-1}
function nextPage(){let p=Math.ceil(backtestData.length/PAGE_SIZE);if(currentPage<p-1){currentPage++;renderPage()}}function prevPage(){if(currentPage>0){currentPage--;renderPage()}}
(async()=>{await loadTeamCN();loadToday()})();
</script></body></html>
